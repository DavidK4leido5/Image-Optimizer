services:
  - type: web
    name: cloudinary-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: INTERNAL_KEY
        sync: false
      - key: PROCESSOR_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_PUBLIC_BASE
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: images
      - key: S3_REGION
        sync: false
      - key: S3_PATH_STYLE
        value: "true"

  - type: web
    name: cloudinary-processor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.processor
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_PUBLIC_BASE
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: images
      - key: S3_REGION
        sync: false
      - key: S3_PATH_STYLE
        value: "true"
