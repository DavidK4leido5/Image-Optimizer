<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>image service</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:#14181d; --line:#232a32; --text:#e6e9ee; --muted:#8b949e; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:28px 32px 8px; }
  h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.2px; }
  header p { margin:6px 0 0; color:var(--muted); }
  main { padding:20px 32px 48px; max-width:1200px; display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  h2 { margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .muted { color:var(--muted); font-size:12px; }
  .small { font-size:11px; margin:10px 0 0; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { color:var(--muted); font-size:12px; }
  input[type=text], select { background:#0e1116; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 10px; }
  input[type=text] { min-width:240px; }
  input[type=file] { color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  .panel.settings { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .status { margin:10px 0 0; color:var(--muted); min-height:20px; }
  .status.err { color:#ff6b6b; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .card { background:#0f1318; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card img { display:block; width:100%; height:160px; object-fit:cover; background:#0e1116; }
  .card .meta { padding:10px 12px 12px; }
  .card .id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.ready { background:#12351f; color:#5ddc8a; }
  .pill.processing { background:#3a2b10; color:#f0b429; }
  .pill.pending { background:#1b2533; color:#7fa8ff; }
  .pill.failed { background:#3a1616; color:#ff7b7b; }
  .variants { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .variants a { color:var(--accent); text-decoration:none; font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .segmented { display:flex; gap:6px; align-items:center; }
  .segmented button { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:5px 10px; font-size:12px; font-weight:500; }
  .segmented button.active { color:#fff; border-color:var(--accent); background:#16233a; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .metric { border:1px solid var(--line); border-radius:8px; padding:12px; background:#0f1318; }
  .metric-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font-size:12px; color:var(--muted); }
  .metric-head strong { color:var(--text); font-size:15px; }
  .spark { width:100%; height:72px; display:block; }
  .spark-empty { height:72px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; }
  .budgets { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .budget { border:1px solid var(--line); border-radius:8px; padding:12px; background:#0f1318; }
  .budget-head { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
  .budget-head strong { color:var(--text); font-size:13px; }
  .bar { height:6px; border-radius:99px; background:#1b2027; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>image service</h1>
  <p>upload once, the processor writes immutable variants, the cdn serves them.</p>
</header>
<main>
  <section class="panel settings">
    <div class="field"><label for="api">api base</label><input id="api" type="text" value="http://localhost:5080"></div>
    <div class="field"><label for="key">api key</label><input id="key" type="password" placeholder="X-Api-Key"></div>
    <div class="field"><label for="cdn">cdn base</label><input id="cdn" type="text" placeholder="defaults to api base"></div>
    <div class="field"><label for="file">image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
    <button id="upload">Upload</button>
    <button id="refresh" class="secondary">Refresh</button>
  </section>
  <p id="status" class="status"></p>

  <section class="panel">
    <div class="panel-head">
      <h2>telemetry</h2>
      <div class="segmented">
        <button class="service active" data-service="cloudinary-api">api</button>
        <button class="service" data-service="cloudinary-processor">processor</button>
        <select id="range" aria-label="time range">
          <option value="1">1h</option>
          <option value="6">6h</option>
          <option value="24">24h</option>
        </select>
      </div>
    </div>
    <div id="metrics" class="metrics"></div>
    <p id="telemetry-note" class="muted small"></p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>free tier</h2>
      <span class="muted">measured · refreshed every 60s</span>
    </div>
    <div id="budgets" class="budgets"></div>
    <p class="muted small">Render instance hours, Worker requests and Supabase egress are only visible in their dashboards.</p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>assets</h2>
      <span id="asset-count" class="muted"></span>
    </div>
    <div id="gallery" class="grid"></div>
  </section>
</main>
<script>
  const el = (id) => document.getElementById(id);
  const apiBase = () => el('api').value.replace(/\/$/, '');
  const apiKey = () => el('key').value;
  const imageBase = () => (el('cdn').value.trim() || el('api').value).replace(/\/$/, '');
  let pollTimer = null;
  let service = 'cloudinary-api';

  for (const id of ['api', 'key', 'cdn']) {
    el(id).value = localStorage.getItem('img.' + id) || el(id).value;
    el(id).addEventListener('change', () => {
      localStorage.setItem('img.' + id, el(id).value);
      load();
      loadLimits();
      loadTelemetry();
    });
  }

  function status(message, error) {
    el('status').textContent = message;
    el('status').className = 'status' + (error ? ' err' : '');
  }

  function headers() {
    return { 'X-Api-Key': apiKey() };
  }

  async function upload() {
    const file = el('file').files[0];
    if (!file) return status('pick an image first', true);
    if (!file.type.startsWith('image/')) return status('that is not an image', true);

    el('upload').disabled = true;
    try {
      status('creating asset');
      const created = await fetch(apiBase() + '/v1/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey() },
        body: JSON.stringify({ fileName: file.name, contentType: file.type, bytes: file.size })
      });
      if (!created.ok) throw new Error('create: ' + created.status + ' ' + await created.text());
      const asset = await created.json();

      status('uploading ' + file.name + ' (' + Math.round(file.size / 1024) + ' kb)');
      const put = await fetch(asset.upload.url, {
        method: asset.upload.method,
        headers: asset.upload.headers,
        body: file
      });
      if (!put.ok) throw new Error('storage: ' + put.status + ' ' + await put.text());

      status('processing');
      const complete = await fetch(apiBase() + '/v1/assets/' + asset.publicId + '/complete', {
        method: 'POST',
        headers: headers()
      });
      if (!complete.ok) throw new Error('complete: ' + complete.status + ' ' + await complete.text());

      await load();
      loadLimits();
      poll();
    } catch (error) {
      status(error.message, true);
    } finally {
      el('upload').disabled = false;
    }
  }

  function poll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      const pending = await load();
      if (!pending) clearInterval(pollTimer);
    }, 2000);
  }

  async function load() {
    if (!apiKey()) { status('set the api key'); return false; }
    const response = await fetch(apiBase() + '/v1/assets', { headers: headers() });
    if (response.status === 401) { status('unauthorized, set the api key', true); return false; }
    if (!response.ok) { status('list: ' + response.status, true); return false; }
    const assets = await response.json();
    render(assets);
    return assets.some((a) => a.status === 'pending' || a.status === 'processing');
  }

  function render(assets) {
    const gallery = el('gallery');
    gallery.replaceChildren();
    el('asset-count').textContent = assets.length + ' total';
    if (!assets.length) { status('no assets yet'); return; }
    const pending = assets.filter((a) => a.status === 'pending' || a.status === 'processing').length;
    if (pending) status(pending + ' asset(s) processing');

    for (const asset of assets) {
      const card = document.createElement('article');
      card.className = 'card';

      const image = document.createElement('img');
      image.alt = asset.publicId;
      image.loading = 'lazy';
      if (asset.variants.length) image.src = imageBase() + asset.variants[0].url;
      card.appendChild(image);

      const meta = document.createElement('div');
      meta.className = 'meta';

      const head = document.createElement('div');
      head.style.display = 'flex';
      head.style.justifyContent = 'space-between';
      head.style.alignItems = 'center';

      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = asset.publicId;
      const pill = document.createElement('span');
      pill.className = 'pill ' + asset.status;
      pill.textContent = asset.status;
      head.append(id, pill);
      meta.appendChild(head);

      if (asset.error) {
        const error = document.createElement('div');
        error.style.color = '#ff7b7b';
        error.style.fontSize = '12px';
        error.style.marginTop = '6px';
        error.textContent = asset.error;
        meta.appendChild(error);
      }

      const variants = document.createElement('div');
      variants.className = 'variants';
      for (const variant of asset.variants) {
        const link = document.createElement('a');
        link.href = imageBase() + variant.url;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = variant.transform + ' · ' + Math.round(variant.bytes / 1024) + ' kb';
        variants.appendChild(link);
      }
      meta.appendChild(variants);
      card.appendChild(meta);
      gallery.appendChild(card);
    }
  }

  function bytes(value) {
    if (value > 1024 * 1024) return (value / (1024 * 1024)).toFixed(1) + ' MB';
    if (value > 1024) return (value / 1024).toFixed(0) + ' KB';
    return value + ' B';
  }

  async function loadLimits() {
    if (!apiKey()) { el('budgets').innerHTML = '<p class="muted">set the api key</p>'; return; }
    try {
      const response = await fetch(apiBase() + '/v1/limits', { headers: headers() });
      if (!response.ok) throw new Error(String(response.status));
      renderBudgets(await response.json());
    } catch (error) {
      el('budgets').innerHTML = '<p class="status err">limits unavailable</p>';
    }
  }

  function renderBudgets(data) {
    const rows = [
      ['database', data.database.bytes, data.database.limit, 'Supabase free: 500 MB', bytes],
      ['storage', data.storage.bytes, data.storage.limit, data.storage.objects + ' objects · Supabase free: 1 GB', bytes],
      ['queue', data.queue.depth, data.queue.limit, 'jobs pending or leased', (value) => String(value)]
    ];
    el('budgets').replaceChildren(...rows.map(([label, used, limit, detail, format]) => {
      const card = document.createElement('div');
      card.className = 'budget';
      const head = document.createElement('div');
      head.className = 'budget-head';
      const name = document.createElement('span');
      name.textContent = label;
      const value = document.createElement('strong');
      value.textContent = format(used) + ' / ' + format(limit);
      head.append(name, value);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('div');
      fill.style.width = Math.min(100, (used / limit) * 100).toFixed(1) + '%';
      bar.appendChild(fill);
      const note = document.createElement('span');
      note.className = 'muted';
      note.textContent = detail;
      card.append(head, bar, note);
      return card;
    }));
  }

  const QUERIES = {
    cpu: 'sum(rate(dotnet_process_cpu_time_seconds_total{service_name="SERVICE"}[2m]))',
    rss: 'max(dotnet_process_memory_working_set_bytes{service_name="SERVICE"})',
    heap: 'sum(dotnet_gc_last_collection_heap_size_bytes{service_name="SERVICE"})',
    rps: 'sum(rate(http_server_request_duration_seconds_count{service_name="SERVICE"}[5m]))',
    p95: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="SERVICE"}[5m])))'
  };

  async function metric(query, start, end, step) {
    const url = apiBase() + '/v1/metrics?q=' + encodeURIComponent(query) + '&start=' + start + '&end=' + end + '&step=' + step;
    const response = await fetch(url, { headers: headers() });
    if (!response.ok) throw new Error(String(response.status));
    const body = await response.json();
    const values = (body.data.result[0] && body.data.result[0].values) || [];
    return values.map(([time, value]) => [time, Number(value)]).filter(([, value]) => Number.isFinite(value));
  }

  async function loadTelemetry() {
    if (!apiKey()) { el('metrics').innerHTML = '<p class="muted">set the api key</p>'; return; }
    const end = Math.floor(Date.now() / 1000);
    const hours = Number(el('range').value);
    const start = end - hours * 3600;
    const step = hours <= 1 ? '60s' : '300s';
    const queries = Object.fromEntries(Object.entries(QUERIES).map(([key, query]) => [key, query.replace('SERVICE', service)]));

    try {
      const results = await Promise.all(Object.entries(queries).map(async ([key, query]) => [key, await metric(query, start, end, step)]));
      renderMetrics(Object.fromEntries(results));
      el('telemetry-note').textContent = '';
    } catch (error) {
      el('metrics').replaceChildren();
      el('telemetry-note').textContent = 'telemetry unavailable: ' + error.message;
    }
  }

  function latest(points) {
    return points.length ? points[points.length - 1][1] : null;
  }

  function spark(points, color) {
    if (points.length < 2) return '<div class="spark-empty">no data yet</div>';
    const width = 320;
    const height = 72;
    const xs = points.map((point) => point[0]);
    const ys = points.map((point) => point[1]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const spanX = maxX - minX || 1;
    const spanY = maxY - minY || 1;
    const path = points.map(([x, y], index) => {
      const px = ((x - minX) / spanX) * width;
      const py = height - 6 - ((y - minY) / spanY) * (height - 12);
      return (index === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
    }).join(' ');
    return '<svg class="spark" viewBox="0 0 320 72" preserveAspectRatio="none"><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }

  function renderMetrics(data) {
    const cards = [
      ['cpu', latest(data.cpu) === null ? '—' : latest(data.cpu).toFixed(3) + ' cores', data.cpu, '#4f8cff'],
      ['memory (rss)', latest(data.rss) === null ? '—' : bytes(latest(data.rss)), data.rss, '#5ddc8a'],
      ['managed heap', latest(data.heap) === null ? '—' : bytes(latest(data.heap)), data.heap, '#7ee0a3'],
      ['requests / s', latest(data.rps) === null ? '—' : latest(data.rps).toFixed(2), data.rps, '#f0b429'],
      ['p95 latency', latest(data.p95) === null ? '—' : (latest(data.p95) * 1000).toFixed(0) + ' ms', data.p95, '#c792ea']
    ];

    el('metrics').replaceChildren(...cards.map(([title, value, points, color]) => {
      const card = document.createElement('div');
      card.className = 'metric';
      const head = document.createElement('div');
      head.className = 'metric-head';
      const name = document.createElement('span');
      name.textContent = title;
      const strong = document.createElement('strong');
      strong.textContent = value;
      head.append(name, strong);
      const chart = document.createElement('div');
      chart.innerHTML = spark(points, color);
      card.append(head, chart.firstElementChild || chart);
      return card;
    }));
  }

  document.querySelectorAll('.service').forEach((button) => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.service').forEach((other) => other.classList.remove('active'));
      button.classList.add('active');
      service = button.dataset.service;
      loadTelemetry();
    });
  });

  el('range').addEventListener('change', loadTelemetry);
  el('upload').addEventListener('click', upload);
  el('refresh').addEventListener('click', () => { load(); loadLimits(); loadTelemetry(); });

  load();
  loadLimits();
  loadTelemetry();
  setInterval(loadLimits, 60000);
  setInterval(loadTelemetry, 30000);
</script>
</body>
</html>
